# The app is only reachable through Caddy, which handles HTTPS and sets the real client IP.
services:
  app:
    build: ..
    restart: unless-stopped
    environment:
      DRONESIGHT_CLIENT_IP_HEADER: X-Forwarded-For
    volumes:
      - data:/srv/data/app
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data

volumes:
  data:
  caddy:
